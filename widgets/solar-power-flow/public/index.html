<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar Power Flow</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: transparent;
    padding: 14px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 8px;
    height: 157px;
  }

  .tile {
    background: var(--homey-line-color);
    border-radius: 12px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .tile-header {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  .label {
    font-size: 11px;
    color: var(--homey-text-color-light);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .value {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1;
    color: var(--homey-text-color);
  }

  .direction {
    font-size: 11px;
    color: var(--homey-text-color-light);
    margin-top: 2px;
    min-height: 14px;
  }

  /* --- Skeleton --- */
  @keyframes skeleton-pulse {
    0%, 100% { opacity: 0.35; }
    50%       { opacity: 0.7;  }
  }
  body.loading .value {
    animation: skeleton-pulse 1.4s ease-in-out infinite;
  }

  /* --- Flow animations --- */
  @keyframes glow-amber {
    0%, 100% { filter: drop-shadow(0 0 0px rgba(245,158,11,0)); }
    50%       { filter: drop-shadow(0 0 5px rgba(245,158,11,0.9)); }
  }
  @keyframes glow-blue {
    0%, 100% { filter: drop-shadow(0 0 0px rgba(59,130,246,0)); }
    50%       { filter: drop-shadow(0 0 5px rgba(59,130,246,0.9)); }
  }
  @keyframes glow-green {
    0%, 100% { filter: drop-shadow(0 0 0px rgba(34,197,94,0)); }
    50%       { filter: drop-shadow(0 0 5px rgba(34,197,94,0.9)); }
  }
  @keyframes glow-orange {
    0%, 100% { filter: drop-shadow(0 0 0px rgba(249,115,22,0)); }
    50%       { filter: drop-shadow(0 0 5px rgba(249,115,22,0.9)); }
  }
  @keyframes glow-red {
    0%, 100% { filter: drop-shadow(0 0 0px rgba(239,68,68,0)); }
    50%       { filter: drop-shadow(0 0 5px rgba(239,68,68,0.9)); }
  }
  @keyframes float-up {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-2px); }
  }
  @keyframes float-down {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(2px); }
  }

  .glow-amber  { animation: glow-amber  2s ease-in-out infinite; }
  .glow-blue   { animation: glow-blue   2s ease-in-out infinite; }
  .glow-green  { animation: glow-green  2s ease-in-out infinite; }
  .glow-orange { animation: glow-orange 2s ease-in-out infinite; }
  .glow-red    { animation: glow-red    2s ease-in-out infinite; }

  .dir-arrow {
    display: inline-block;
  }
  .float-up   { animation: float-up   1.2s ease-in-out infinite; }
  .float-down { animation: float-down 1.2s ease-in-out infinite; }
</style>
</head>
<body class="loading">
<div class="grid">

  <!-- Solar PV -->
  <div class="tile">
    <div class="tile-header">
      <svg class="icon" id="pv-icon" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <line x1="12" y1="2"  x2="12" y2="5"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
        <line x1="4.22"  y1="4.22"  x2="6.34"  y2="6.34"/>
        <line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/>
        <line x1="2"  y1="12" x2="5"  y2="12"/>
        <line x1="19" y1="12" x2="22" y2="12"/>
        <line x1="4.22"  y1="19.78" x2="6.34"  y2="17.66"/>
        <line x1="17.66" y1="6.34"  x2="19.78" y2="4.22"/>
      </svg>
      <span class="label">Solar PV</span>
    </div>
    <div>
      <div class="value" id="pv-val">—</div>
      <div class="direction" id="pv-dir"></div>
    </div>
  </div>

  <!-- Haus -->
  <div class="tile">
    <div class="tile-header">
      <svg class="icon" id="house-icon" viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9,22 9,12 15,12 15,22"/>
      </svg>
      <span class="label">Haus</span>
    </div>
    <div>
      <div class="value" id="house-val">—</div>
      <div class="direction" id="house-dir"></div>
    </div>
  </div>

  <!-- Batterie -->
  <div class="tile">
    <div class="tile-header">
      <svg class="icon" id="batt-icon" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="7" width="16" height="10" rx="2"/>
        <line x1="22" y1="10" x2="22" y2="14"/>
        <line x1="6"  y1="12" x2="12" y2="12"/>
        <line x1="9"  y1="9"  x2="9"  y2="15"/>
      </svg>
      <span class="label">Batterie</span>
    </div>
    <div>
      <div class="value" id="batt-val">—</div>
      <div class="direction" id="batt-dir"></div>
    </div>
  </div>

  <!-- Netz -->
  <div class="tile">
    <div class="tile-header">
      <svg class="icon" id="grid-icon" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13,2 3,14 12,14 11,22 21,10 12,10"/>
      </svg>
      <span class="label">Netz</span>
    </div>
    <div>
      <div class="value" id="grid-val">—</div>
      <div class="direction" id="grid-dir"></div>
    </div>
  </div>

</div>

<script>
function fmt(w) {
  if (w === null || w === undefined) return '—';
  const abs = Math.abs(w);
  if (abs >= 1000) return (abs / 1000).toFixed(1) + ' kW';
  return Math.round(abs) + ' W';
}

function setIconGlow(id, cls) {
  var el = document.getElementById(id);
  // SVG className is SVGAnimatedString — must use setAttribute
  el.setAttribute('class', 'icon' + (cls ? ' ' + cls : ''));
}

function setDir(id, arrow, text, color) {
  var el = document.getElementById(id);
  if (arrow) {
    el.innerHTML = '<span class="dir-arrow ' + arrow + '">' + (arrow === 'float-up' ? '↑' : '↓') + '</span> ' + text;
  } else {
    el.textContent = text;
  }
  el.style.color = color || '';
}

function onHomeyReady(Homey) {
  Homey.ready({ height: 185 });
  document.body.classList.add('loading');

  function render(data) {
    document.body.classList.remove('loading');

    // Solar PV
    document.getElementById('pv-val').textContent = fmt(data.pvPower);
    if (data.pvPower > 50) {
      setIconGlow('pv-icon', 'glow-amber');
      setDir('pv-dir', 'float-up', 'Erzeugung', '#F59E0B');
    } else {
      setIconGlow('pv-icon', '');
      setDir('pv-dir', null, '—', '');
    }

    // Haus
    document.getElementById('house-val').textContent = fmt(data.housePower);
    if (data.housePower > 50) {
      setIconGlow('house-icon', 'glow-blue');
      setDir('house-dir', 'float-down', 'Verbrauch', '#3B82F6');
    } else {
      setIconGlow('house-icon', '');
      setDir('house-dir', null, 'Verbrauch', '');
    }

    // Batterie
    document.getElementById('batt-val').textContent = fmt(data.batteryPower);
    if (data.batteryPower > 50) {
      document.getElementById('batt-icon').setAttribute('stroke', '#22C55E');
      setIconGlow('batt-icon', 'glow-green');
      setDir('batt-dir', 'float-up', 'Laden', '#22C55E');
    } else if (data.batteryPower < -50) {
      document.getElementById('batt-icon').setAttribute('stroke', '#F97316');
      setIconGlow('batt-icon', 'glow-orange');
      setDir('batt-dir', 'float-down', 'Entladen', '#F97316');
    } else {
      document.getElementById('batt-icon').setAttribute('stroke', '#9CA3AF');
      setIconGlow('batt-icon', '');
      setDir('batt-dir', null, '— Standby', '');
    }

    // Netz
    document.getElementById('grid-val').textContent = fmt(data.gridPower);
    if (data.gridPower < -50) {
      document.getElementById('grid-icon').setAttribute('stroke', '#22C55E');
      setIconGlow('grid-icon', 'glow-green');
      setDir('grid-dir', 'float-up', 'Einspeisung', '#22C55E');
    } else if (data.gridPower > 50) {
      document.getElementById('grid-icon').setAttribute('stroke', '#EF4444');
      setIconGlow('grid-icon', 'glow-red');
      setDir('grid-dir', 'float-down', 'Netzbezug', '#EF4444');
    } else {
      document.getElementById('grid-icon').setAttribute('stroke', '#9CA3AF');
      setIconGlow('grid-icon', '');
      setDir('grid-dir', null, '— Ausgeglichen', '');
    }
  }

  function load() {
    Homey.api('GET', '/', {})
      .then(function(data) { if (data) render(data); })
      .catch(function(err) { console.error('widget load error:', err); });
  }

  load();
  setInterval(load, 10000);
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden) load();
  });
}
</script>
</body>
</html>
