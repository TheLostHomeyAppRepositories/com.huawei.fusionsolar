<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Colors come from Homey's own --homey-* variables (see the widget styling
     guide), which the dashboard sets according to the user's light/dark theme
     choice — NOT the OS-level prefers-color-scheme, which widgets don't get to
     read reliably. Never hardcode light/dark pairs here again. */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, "Helvetica Neue", Roboto, Arial, sans-serif;
    background: transparent;
    color: var(--homey-text-color);
  }
  .card { background: var(--homey-background-color); border-radius: 16px; padding: 14px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .name { font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge {
    font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px;
    background: rgba(128,128,128,0.15); color: var(--homey-text-color-light); white-space: nowrap; flex-shrink: 0;
  }
  .badge.on  { background: rgba(52,199,89,0.16);  color: var(--homey-text-color-green); }
  .badge.off { background: rgba(128,128,128,0.15); color: var(--homey-text-color-light); }

  .control-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px; padding: 7px 10px; border-radius: 10px;
    background: rgba(128,128,128,0.08);
  }
  .control-row label { font-size: 12px; font-weight: 600; }
  .switch {
    position: relative; width: 38px; height: 22px; flex-shrink: 0;
    border: none; border-radius: 11px; padding: 0; cursor: pointer;
    background: rgba(128,128,128,0.35); transition: background 0.15s ease;
  }
  .switch.on { background: var(--homey-color-green, #34c759); }
  .switch .knob {
    position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    transition: transform 0.15s ease;
  }
  .switch.on .knob { transform: translateX(16px); }

  .mode-select {
    margin-top: 10px; width: 100%; font-size: 12px; font-weight: 600;
    padding: 7px 10px; border-radius: 10px; border: 1px solid var(--homey-line-color, rgba(128,128,128,0.3));
    background: rgba(128,128,128,0.08); color: var(--homey-text-color); appearance: none;
    -webkit-appearance: none;
  }

  .divider { height: 1px; background: var(--homey-line-color-light, rgba(128,128,128,0.2)); margin-top: 12px; }
  .stats { display: flex; justify-content: space-between; margin-top: 10px; }
  .stat-value { font-size: 16px; font-weight: 700; color: var(--homey-text-color-blue); display: flex; align-items: center; gap: 3px; }
  .stat-value.charging { border-bottom: 2px dashed var(--homey-color-green, #34c759); padding-bottom: 2px; width: fit-content; }
  .bolt { width: 13px; height: 13px; color: var(--homey-color-green, #34c759); display: none; flex-shrink: 0; }
  .stat-value.charging .bolt { display: block; }
  .stat-label { font-size: 9px; color: var(--homey-text-color-light); text-transform: uppercase; letter-spacing: 0.4px; margin-top: 1px; }
  .sub-line { font-size: 11px; color: var(--homey-text-color-light); margin-top: 6px; min-height: 14px; }

  .surplus-row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; gap: 8px; }
  .surplus-row label { font-size: 11px; color: var(--homey-text-color-light); }
  .surplus-row .value { font-size: 13px; font-weight: 600; color: var(--homey-text-color); }

  /* ── Car sub-card (only for charger kind, when a car is assigned) ── */
  .car-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--homey-line-color-light, rgba(128,128,128,0.2)); }
  .car-head { display: flex; align-items: center; gap: 6px; }
  .car-icon { width: 16px; height: 16px; flex-shrink: 0; color: var(--homey-text-color-light); }
  .car-name {
    font-size: 13px; font-weight: 600; text-decoration: underline;
    text-decoration-color: rgba(128,128,128,0.4); text-underline-offset: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .car-status { font-size: 11px; color: var(--homey-text-color-light); margin-top: 4px; min-height: 14px; }
  .car-bar-wrap { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .car-battery-icon { width: 14px; height: 14px; flex-shrink: 0; color: var(--homey-text-color-light); }
  .car-bar-track { flex: 1; position: relative; height: 10px; border-radius: 6px; background: rgba(128,128,128,0.14); overflow: hidden; }
  .car-bar-fill { height: 100%; background: var(--homey-color-green, #22c55e); border-radius: 6px; transition: width 0.3s ease; }
  .car-bar-marker { position: absolute; top: -2px; width: 2px; height: 14px; background: var(--homey-line-color, rgba(128,128,128,0.6)); }
  /* Ladeziel-Auswahl. Bewusst unter dem Balken statt als Markierungen darauf: der Track ist
     10 px hoch und hat overflow:hidden, Tippziele darin waeren winzig und abgeschnitten. */
  .car-picks { display: flex; gap: 6px; margin-top: 8px; }
  .car-pick {
    flex: 1; padding: 4px 0; font: inherit; font-size: 11px; font-weight: 600;
    color: var(--homey-text-color-light); background: rgba(128,128,128,0.12);
    border: 1px solid transparent; border-radius: 999px; cursor: pointer;
  }
  .car-pick.is-active {
    color: var(--homey-text-color); background: rgba(34,197,94,0.18);
    border-color: var(--homey-color-green, #22c55e);
  }
  .car-pick:disabled { opacity: 0.5; cursor: default; }
  .car-pick.is-error { border-color: var(--homey-color-red, #ef4444); }
  .car-stats { display: flex; justify-content: space-between; margin-top: 8px; }
  .car-stat-value { font-size: 13px; font-weight: 700; color: var(--homey-text-color); }
  .car-stat-label { font-size: 9px; color: var(--homey-text-color-light); text-transform: uppercase; letter-spacing: 0.4px; margin-top: 1px; }

  .no-data { font-size: 12px; color: var(--homey-text-color-light); text-align: center; padding: 20px 4px; }
  .saved-flash { color: var(--homey-text-color-green) !important; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="no-data" id="noData" style="display:none"></div>
    <div id="content" style="display:none">
      <div class="head">
        <div class="name" id="name">—</div>
        <div class="badge" id="badge">—</div>
      </div>
      <div class="sub-line" id="subLine"></div>

      <div class="control-row">
        <label id="controlLabel">—</label>
        <button type="button" class="switch" id="controlSwitch" role="switch" aria-checked="false">
          <span class="knob"></span>
        </button>
      </div>

      <select class="mode-select" id="modeSelect" style="display:none"></select>

      <div class="control-row" id="chargeNowRow" style="display:none">
        <label id="chargeNowLabel">—</label>
        <button type="button" class="switch" id="chargeNowSwitch" role="switch" aria-checked="false">
          <span class="knob"></span>
        </button>
      </div>

      <div class="divider"></div>
      <div class="stats">
        <div>
          <div class="stat-value" id="stat1group">
            <span id="stat1v">—</span>
            <svg class="bolt" id="stat1bolt" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>
          </div>
          <div class="stat-label" id="stat1l">—</div>
        </div>
        <div>
          <div class="stat-value" id="stat2v">—</div>
          <div class="stat-label" id="stat2l">—</div>
        </div>
        <div>
          <div class="stat-value" id="stat3v">—</div>
          <div class="stat-label" id="stat3l">—</div>
        </div>
      </div>

      <div class="surplus-row" id="surplusRow" style="display:none">
        <label id="surplusLabel">—</label>
        <span class="value" id="surplusValue">—</span>
      </div>

      <div class="car-section" id="carSection" style="display:none">
        <div class="car-head">
          <svg class="car-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 17h-2v-6l2-5h10l4 5h1a1 1 0 0 1 1 1v5h-2"/>
            <circle cx="7.5" cy="17.5" r="2.5"/>
            <circle cx="17.5" cy="17.5" r="2.5"/>
          </svg>
          <span class="car-name" id="carName">—</span>
        </div>
        <div class="car-status" id="carStatus"></div>
        <div class="car-bar-wrap">
          <svg class="car-battery-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="16" height="10" rx="2"/>
            <line x1="22" y1="10" x2="22" y2="14"/>
          </svg>
          <div class="car-bar-track">
            <div class="car-bar-fill" id="carBarFill" style="width:0%"></div>
            <div class="car-bar-marker" id="carBarMarker" style="display:none"></div>
          </div>
        </div>
        <div class="car-picks" id="carPicks" style="display:none">
          <button type="button" class="car-pick" data-soc="80">80%</button>
          <button type="button" class="car-pick" data-soc="90">90%</button>
          <button type="button" class="car-pick" data-soc="100">100%</button>
        </div>
        <div class="car-stats">
          <div>
            <div class="car-stat-value" id="carSocVal">—</div>
            <div class="car-stat-label" id="carSocLabel">—</div>
          </div>
          <div>
            <div class="car-stat-value" id="carPlanVal">—</div>
            <div class="car-stat-label" id="carPlanLabel">—</div>
          </div>
          <div>
            <div class="car-stat-value" id="carLimitVal">—</div>
            <div class="car-stat-label" id="carLimitLabel">—</div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script type="text/javascript">
function onHomeyReady(Homey) {
  // The active language comes from the API payload (Homey's own i18n.getLanguage()),
  // NOT from navigator.language — that is the browser/OS language, which can differ from
  // the Homey app language (an English phone paired with a German Homey used to render
  // the widget in English). navigator.language is only the placeholder for the moment
  // before the first response lands.
  var DICTS = (function () {
    var de = {
      noSetting: 'Bitte Gerät in den Widget-Einstellungen auswählen',
      unreachable: 'EMS-Gerät nicht erreichbar',
      notFound: 'Gerät nicht mehr konfiguriert',
      connected: 'Verbunden', notConnected: 'Nicht verbunden',
      on: 'An', off: 'Aus',
      power: 'Leistung', today: 'Heute', charged: 'Geladen', runtime: 'Laufzeit', remaining: 'Restzeit',
      minSurplus: 'Min. Überschuss', emsControl: 'EMS-Steuerung',
      instantCharge: 'Sofortladen', instantChargeHint: 'Lädt sofort mit voller Leistung — gilt für alle Lader an diesem EMS-Gerät, bis wieder ausgeschaltet',
      modes: { solar: 'Solar', solar_offpeak: 'Solar + Off-Peak', solar_lowtariff: 'Solar + Niedertarif', solar_price: 'Solar + Preis', always: 'Immer laden' },
      chargingActive: 'Ladevorgang aktiv …', waitingSurplus: 'Wartet auf Überschuss …',
      socLabel: 'Ladestand', planLabel: 'Plan', limitLabel: 'Ladelimit',
      writeFailed: 'Änderung fehlgeschlagen',
    };
    var nl = {
      noSetting: 'Selecteer een apparaat in de widget-instellingen',
      unreachable: 'EMS-apparaat niet bereikbaar',
      notFound: 'Apparaat niet meer geconfigureerd',
      connected: 'Verbonden', notConnected: 'Niet verbonden',
      on: 'Aan', off: 'Uit',
      power: 'Vermogen', today: 'Vandaag', charged: 'Geladen', runtime: 'Looptijd', remaining: 'Resterende tijd',
      minSurplus: 'Min. overschot', emsControl: 'EMS-besturing',
      instantCharge: 'Direct laden', instantChargeHint: 'Laadt direct met vol vermogen — geldt voor alle laders op dit EMS-apparaat, tot weer uitgeschakeld',
      modes: { solar: 'Zon', solar_offpeak: 'Zon + daltarief', solar_lowtariff: 'Zon + laag tarief', solar_price: 'Zon + prijs', always: 'Altijd laden' },
      chargingActive: 'Bezig met laden …', waitingSurplus: 'Wacht op overschot …',
      socLabel: 'Laadstand', planLabel: 'Plan', limitLabel: 'Laadlimiet',
      writeFailed: 'Wijziging mislukt',
    };
    var en = {
      noSetting: 'Select a device in widget settings',
      unreachable: 'EMS device unreachable',
      notFound: 'Device no longer configured',
      connected: 'Connected', notConnected: 'Not connected',
      on: 'On', off: 'Off',
      power: 'Power', today: 'Today', charged: 'Charged', runtime: 'Runtime', remaining: 'Remaining time',
      minSurplus: 'Min. surplus', emsControl: 'EMS control',
      instantCharge: 'Instant charge', instantChargeHint: 'Charges immediately at full power — applies to every charger on this EMS device until switched off again',
      modes: { solar: 'Solar', solar_offpeak: 'Solar + Off-peak', solar_lowtariff: 'Solar + Low tariff', solar_price: 'Solar + Price', always: 'Always charge' },
      chargingActive: 'Charging in progress …', waitingSurplus: 'Waiting for surplus …',
      socLabel: 'Charge level', planLabel: 'Plan', limitLabel: 'Charge limit',
      writeFailed: 'Change failed',
    };
    return { de: de, nl: nl, en: en };
  })();
  function dictFor(code) {
    var l = String(code || '');
    return l.indexOf('de') === 0 ? DICTS.de : l.indexOf('nl') === 0 ? DICTS.nl : DICTS.en;
  }
  var activeLang = null;
  var T = dictFor(navigator.language); // placeholder until the first payload arrives
  // Returns true when the language actually changed, so callers can rebuild the bits
  // that are only constructed once (the <select> options).
  function applyLang(code) {
    if (!code || code === activeLang) return false;
    activeLang = code;
    T = dictFor(code);
    return true;
  }

  var card       = document.getElementById('card');
  var noData     = document.getElementById('noData');
  var content    = document.getElementById('content');
  var nameEl     = document.getElementById('name');
  var badgeEl    = document.getElementById('badge');
  var subLineEl  = document.getElementById('subLine');
  var controlLabel  = document.getElementById('controlLabel');
  var controlSwitch = document.getElementById('controlSwitch');
  var modeSelect = document.getElementById('modeSelect');
  var chargeNowRow    = document.getElementById('chargeNowRow');
  var chargeNowLabel  = document.getElementById('chargeNowLabel');
  var chargeNowSwitch = document.getElementById('chargeNowSwitch');
  var stat1group = document.getElementById('stat1group'), stat1v = document.getElementById('stat1v'), stat1l = document.getElementById('stat1l');
  var stat2v = document.getElementById('stat2v'), stat2l = document.getElementById('stat2l');
  var stat3v = document.getElementById('stat3v'), stat3l = document.getElementById('stat3l');
  var surplusRow   = document.getElementById('surplusRow');
  var surplusLabel = document.getElementById('surplusLabel');
  var surplusValue = document.getElementById('surplusValue');
  var carSection  = document.getElementById('carSection');
  var carNameEl   = document.getElementById('carName');
  var carStatusEl = document.getElementById('carStatus');
  var carBarFill   = document.getElementById('carBarFill');
  var carBarMarker = document.getElementById('carBarMarker');
  var carPicks = document.getElementById('carPicks');
  var _carId = null;          // aus /status; Schluessel fuer POST /ems/car-target
  var _pickBusy = false;      // verhindert Doppelklicks waehrend der Anfrage laeuft

  // Hebt den Chip hervor, der dem aktuellen Ladeziel entspricht.
  function _paintPicks(target) {
    var t = target != null ? Math.round(target) : null;
    Array.prototype.forEach.call(carPicks.children, function(btn) {
      btn.classList.toggle('is-active', t !== null && Number(btn.dataset.soc) === t);
      btn.classList.remove('is-error');
      btn.disabled = _pickBusy;
    });
  }

  carPicks.addEventListener('click', async function(ev) {
    var btn = ev.target.closest('.car-pick');
    if (!btn || !_carId || _pickBusy) return;
    var soc = Number(btn.dataset.soc);
    // Optimistisch schalten: das Ziel laeuft ueber einen Flow zum Fahrzeug, die Antwort
    // des naechsten /status-Abrufs kaeme sonst erst Sekunden spaeter.
    _pickBusy = true;
    _paintPicks(soc);
    carLimitVal.textContent = soc + '%';
    try {
      var res = await Homey.api('POST', '/car-target', { carId: _carId, soc: soc });
      if (res && res.error) throw new Error(res.error);
    } catch (e) {
      btn.classList.add('is-error');   // Anzeige korrigiert sich beim naechsten /status
    } finally {
      _pickBusy = false;
      Array.prototype.forEach.call(carPicks.children, function(b) { b.disabled = false; });
    }
  });

  var carSocVal = document.getElementById('carSocVal'), carSocLabel = document.getElementById('carSocLabel');
  var carPlanVal = document.getElementById('carPlanVal'), carPlanLabel = document.getElementById('carPlanLabel');
  var carLimitVal = document.getElementById('carLimitVal'), carLimitLabel = document.getElementById('carLimitLabel');

  function fmtPower(w) {
    if (w === null || w === undefined) return '—';
    var kw = w / 1000;
    return kw >= 1 ? kw.toFixed(1) + ' kW' : Math.round(w) + ' W';
  }
  function fmtEnergy(kwh) {
    if (kwh === null || kwh === undefined) return '—';
    return kwh.toFixed(1) + ' kWh';
  }
  function fmtDuration(ms) {
    if (!ms || ms <= 0) return '—';
    var mins = Math.floor(ms / 60000);
    if (mins < 60) return mins + 'm';
    var h = Math.floor(mins / 60);
    return h + 'h ' + (mins % 60) + 'm';
  }
  // Estimated time left to reach the car's target SOC at the current charging
  // power — capacityKwh * (target - soc) / 100, divided by the current kW.
  // Just an estimate (assumes constant power); '—' whenever any input is
  // missing, already at/above target, or not actually drawing power.
  function fmtRemaining(s) {
    if (!s.carCapacityKwh || s.carSoc == null || s.carTarget == null || !(s.powerW > 0)) return '—';
    var pct = s.carTarget - s.carSoc;
    if (pct <= 0) return '—';
    var hours = (s.carCapacityKwh * pct / 100) / (s.powerW / 1000);
    if (!isFinite(hours) || hours <= 0) return '—';
    var h = Math.floor(hours);
    var m = Math.round((hours - h) * 60);
    if (m === 60) { h++; m = 0; }
    return h + ':' + (m < 10 ? '0' : '') + m + ' h';
  }

  function showNoData(msg) {
    content.style.display = 'none';
    noData.style.display  = 'block';
    noData.textContent    = msg;
  }

  var settings = {};
  try { settings = Homey.getSettings() || {}; } catch (e) {}
  var deviceSetting = settings.device;
  var deviceId = (deviceSetting && typeof deviceSetting === 'object') ? deviceSetting.id
               : (typeof deviceSetting === 'string' ? deviceSetting : null);

  if (!deviceId) {
    document.body.classList.remove('loading');
    showNoData(T.noSetting);
    Homey.ready({ height: 90 });
    // Without a device there is no status poll, so the language would never arrive —
    // fetch it once so this message is localised too (the endpoint answers with
    // { error: 'no_device_selected', lang } when no device is given).
    Homey.api('GET', '/status')
      .then(function (r) { if (r && applyLang(r.lang)) showNoData(T.noSetting); })
      .catch(function () {});
    return;
  }

  var controlBound = false;
  var chargeNowBound = false;
  var lastKind = null;
  var currentEnabled = null;
  var currentChargeNow = null;

  // A failed write used to be swallowed by `.catch(() => {})`, so the control simply
  // sprang back on some later poll with no explanation. Show the reason for a few
  // seconds instead; renders leave the sub-line alone while a message is on screen.
  var errorUntil = 0;
  function flashError(msg) {
    errorUntil = Date.now() + 4000;
    subLineEl.textContent = '⚠ ' + msg;
    subLineEl.style.color = 'var(--homey-text-color-red, #ef4444)';
  }
  function clearSubLine() {
    if (Date.now() < errorUntil) return; // keep the error visible
    subLineEl.textContent = '';
    subLineEl.style.color = '';
  }

  // Every control write goes through here: the UI already changed optimistically, so on
  // success we confirm with an immediate refresh instead of waiting up to POLL_MS, and on
  // failure we roll the optimistic change back and say why.
  function write(path, body, rollback) {
    Homey.api('POST', path, body)
      .then(function (res) {
        if (res && res.error) throw new Error(res.error);
        refresh();
      })
      .catch(function (err) {
        if (rollback) rollback();
        flashError((err && err.message) ? err.message : T.writeFailed);
      });
  }

  function setSwitchVisualEl(el, on) {
    el.className = 'switch' + (on ? ' on' : '');
    el.setAttribute('aria-checked', on ? 'true' : 'false');
  }
  function setSwitchVisual(on) { setSwitchVisualEl(controlSwitch, on); }
  function bindControlSwitch() {
    controlLabel.textContent = T.emsControl;
    if (controlBound) return;
    controlBound = true;
    controlSwitch.addEventListener('click', function () {
      var prev = currentEnabled;
      var next = !currentEnabled;
      currentEnabled = next;
      setSwitchVisual(next); // optimistic
      write('/enabled', { device: deviceId, enabled: next }, function () {
        currentEnabled = prev;
        setSwitchVisual(prev);
      });
    });
  }
  function bindChargeNowSwitch() {
    chargeNowLabel.textContent = T.instantCharge;
    chargeNowRow.title = T.instantChargeHint;
    if (chargeNowBound) return;
    chargeNowBound = true;
    chargeNowSwitch.addEventListener('click', function () {
      var prev = currentChargeNow;
      var next = !currentChargeNow;
      currentChargeNow = next;
      setSwitchVisualEl(chargeNowSwitch, next); // optimistic
      write('/charge-now', { chargeNow: next }, function () {
        currentChargeNow = prev;
        setSwitchVisualEl(chargeNowSwitch, prev);
      });
    });
  }
  var modeSelectBound = false;
  function bindModeSelect() {
    if (modeSelectBound) return;
    modeSelectBound = true;
    modeSelect.addEventListener('change', function () {
      var prev = modeSelect.dataset.applied || 'solar';
      var next = modeSelect.value;
      modeSelect.dataset.applied = next;
      write('/mode', { device: deviceId, mode: next }, function () {
        modeSelect.value = prev;
        modeSelect.dataset.applied = prev;
      });
    });
  }
  function renderCharger(s) {
    nameEl.textContent = s.name || '—';
    badgeEl.className   = 'badge' + (s.connected ? ' on' : '');
    badgeEl.textContent  = s.connected ? T.connected : T.notConnected;
    clearSubLine();

    currentEnabled = s.enabled !== false;
    setSwitchVisual(currentEnabled);
    bindControlSwitch();

    // Rebuild when empty OR when the language changed — the options are otherwise
    // built once and would keep the language they were first rendered in.
    if (modeSelect.children.length === 0 || modeSelect.dataset.lang !== String(activeLang)) {
      modeSelect.innerHTML = '';
      modeSelect.dataset.lang = String(activeLang);
      Object.keys(T.modes).forEach(function (m) {
        var opt = document.createElement('option');
        opt.value = m; opt.textContent = T.modes[m];
        modeSelect.appendChild(opt);
      });
    }
    modeSelect.value = s.chargeMode || 'solar';
    modeSelect.dataset.applied = modeSelect.value; // rollback reference for a failed write
    modeSelect.style.display = '';
    bindModeSelect();

    currentChargeNow = s.chargeNow === true;
    setSwitchVisualEl(chargeNowSwitch, currentChargeNow);
    chargeNowRow.style.display = 'flex';
    bindChargeNowSwitch();

    var isCharging = s.connected && s.powerW > 0;
    stat1group.className = 'stat-value' + (isCharging ? ' charging' : '');
    stat1v.textContent = fmtPower(s.powerW); stat1l.textContent = T.power;
    stat2v.textContent = fmtEnergy(s.sessionEnergyKwh); stat2l.textContent = T.charged;
    stat3v.textContent = fmtRemaining(s); stat3l.textContent = T.remaining;

    surplusRow.style.display = 'none';

    if (s.carName) {
      carSection.style.display = 'block';
      carNameEl.textContent = s.carName;
      carStatusEl.textContent = !s.connected ? T.notConnected : (isCharging ? T.chargingActive : T.waitingSurplus);

      var soc = s.carSoc != null ? Math.max(0, Math.min(100, s.carSoc)) : 0;
      carBarFill.style.width = soc + '%';
      if (s.carTarget != null) {
        carBarMarker.style.left = Math.max(0, Math.min(100, s.carTarget)) + '%';
        carBarMarker.style.display = '';
      } else {
        carBarMarker.style.display = 'none';
      }

      carSocLabel.textContent = T.socLabel;
      carSocVal.textContent   = s.carSoc != null ? Math.round(s.carSoc) + '%' : '—';

      carLimitLabel.textContent = T.limitLabel;
      carLimitVal.textContent   = s.carTarget != null ? Math.round(s.carTarget) + '%' : '—';

      // Ladeziel-Auswahl nur zeigen, wenn ueberhaupt ein Fahrzeug gebunden ist — der
      // carId kommt aus derselben Antwort und ist der Schluessel fuer die Route.
      _carId = s.carId || null;
      if (_carId) {
        carPicks.style.display = '';
        _paintPicks(s.carTarget);
      } else {
        carPicks.style.display = 'none';
      }

      carPlanLabel.textContent = T.planLabel;
      carPlanVal.textContent   = (s.chargeMode === 'solar_price' && s.carReadyBy) ? s.carReadyBy : '—';
    } else {
      carSection.style.display = 'none';
    }
  }

  function renderSimple(s) {
    nameEl.textContent = s.name || '—';
    badgeEl.className   = 'badge' + (s.isOn ? ' on' : ' off');
    badgeEl.textContent  = s.isOn ? T.on : T.off;
    clearSubLine();

    currentEnabled = s.enabled !== false;
    setSwitchVisual(currentEnabled);
    bindControlSwitch();
    modeSelect.style.display = 'none';
    chargeNowRow.style.display = 'none';

    stat1group.className = 'stat-value' + (s.isOn ? ' charging' : '');
    stat1v.textContent = fmtPower(s.powerW); stat1l.textContent = T.power;
    stat2v.textContent = fmtEnergy(s.todayKwh); stat2l.textContent = T.today;
    stat3v.textContent = fmtDuration(s.todayRuntimeMs); stat3l.textContent = T.runtime;

    surplusLabel.textContent = T.minSurplus;
    surplusValue.textContent = fmtPower(s.minSurplusW);
    surplusRow.style.display = 'flex';

    carSection.style.display = 'none';
  }

  // Homey.setHeight() crosses the iframe boundary, so only call it when the height has
  // actually changed rather than on every single poll.
  var lastHeight = 0;
  function syncHeight() {
    requestAnimationFrame(function () {
      var h = Math.ceil(card.getBoundingClientRect().bottom) + 4;
      if (h === lastHeight) return;
      lastHeight = h;
      Homey.setHeight(h);
    });
  }

  function render(s) {
    applyLang(s && s.lang); // authoritative language, before anything is drawn
    if (!s || s.error === 'no_ems_device') { showNoData(T.unreachable); syncHeight(); return; }
    if (!s || s.error === 'not_found')     { showNoData(T.notFound);   syncHeight(); return; }
    if (!s || s.error)                     { showNoData(T.unreachable); syncHeight(); return; }

    content.style.display = 'block';
    noData.style.display  = 'none';

    if (s.kind === 'charger') renderCharger(s); else renderSimple(s);
    lastKind = s.kind;
    syncHeight();
  }

  async function refresh() {
    try {
      var s = await Homey.api('GET', '/status?device=' + encodeURIComponent(deviceId));
      render(s);
    } catch (err) {
      render({ error: 'unreachable' });
    }
  }

  // The EMS recomputes only every TICK_MS (15 s) and this endpoint reads that tick's
  // cached snapshot, so a faster poll just re-fetches identical data. Poll in step with
  // the tick — writes confirm themselves immediately via write() above, so the slower
  // cadence costs nothing in responsiveness. While the dashboard is hidden we stop
  // entirely (an open widget used to poll around the clock) and catch up on return.
  var POLL_MS = 15000;
  var timer = null;
  function startPolling() { if (!timer) timer = setInterval(refresh, POLL_MS); }
  function stopPolling()  { if (timer) { clearInterval(timer); timer = null; } }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { stopPolling(); return; }
    refresh();
    startPolling();
  });

  Homey.ready({ height: 220 });
  refresh();
  if (!document.hidden) startPolling();
}
</script>
</body>
</html>
