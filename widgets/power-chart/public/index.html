<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leistungsverlauf</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: transparent;
    padding: 14px;
  }

  /* Header row: live value + peak */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }

  .header-left {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }

  .live-label {
    font-size: 11px;
    color: var(--homey-text-color-light);
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .live-value {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #F59E0B;
  }

  .peak-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1px;
  }

  .peak-label {
    font-size: 10px;
    color: var(--homey-text-color-light);
  }

  .peak-value {
    font-size: 13px;
    font-weight: 600;
    color: var(--homey-text-color);
  }

  /* Chart */
  .chart-wrap {
    position: relative;
    margin-bottom: 4px;
  }

  #chart {
    width: 100%;
    height: 100px;
    display: block;
    overflow: visible;
  }

  /* Time labels */
  .time-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .time-lbl {
    font-size: 10px;
    color: var(--homey-text-color-light);
  }

  /* Stats bar */
  .stats {
    display: flex;
    gap: 8px;
  }

  .stat-chip {
    flex: 1;
    background: var(--homey-line-color);
    border-radius: 8px;
    padding: 5px 8px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .stat-icon {
    width: 13px;
    height: 13px;
    flex-shrink: 0;
  }

  .stat-val {
    font-size: 12px;
    font-weight: 600;
    color: var(--homey-text-color);
  }

  /* No-data placeholder */
  .no-data {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100px;
    font-size: 11px;
    color: var(--homey-text-color-light);
    text-align: center;
  }

  /* Skeleton */
  @keyframes skeleton-pulse {
    0%, 100% { opacity: 0.35; }
    50%       { opacity: 0.7; }
  }
  body.loading .live-value,
  body.loading .stat-val {
    animation: skeleton-pulse 1.4s ease-in-out infinite;
  }
</style>
</head>
<body class="loading">

<div class="header">
  <div class="header-left">
    <span class="live-label">PV</span>
    <span class="live-value" id="live-pv">—</span>
  </div>
  <div class="peak-wrap" id="peak-wrap" style="display:none">
    <span class="peak-label">Tages-Max</span>
    <span class="peak-value" id="peak-val">—</span>
  </div>
</div>

<div class="chart-wrap">
  <!-- SVG chart — viewBox 300×80, preserveAspectRatio=none fills width -->
  <svg id="chart" viewBox="0 0 300 80" preserveAspectRatio="none">
    <!-- Grid lines -->
    <line x1="0" y1="78" x2="300" y2="78" stroke="currentColor" stroke-opacity="0.08" stroke-width="1"/>
    <line x1="0" y1="40" x2="300" y2="40" stroke="currentColor" stroke-opacity="0.05" stroke-width="1" stroke-dasharray="3,4"/>
    <!-- House fill (blue, bottom layer) -->
    <polygon id="house-fill" points="" fill="rgba(59,130,246,0.10)"/>
    <!-- Battery fill (orange) -->
    <polygon id="batt-fill" points="" fill="rgba(249,115,22,0.12)"/>
    <!-- Grid export fill (green) -->
    <polygon id="export-fill" points="" fill="rgba(34,197,94,0.12)"/>
    <!-- Grid import fill (red) -->
    <polygon id="import-fill" points="" fill="rgba(239,68,68,0.12)"/>
    <!-- PV fill (amber, on top of all fills) -->
    <polygon id="pv-fill" points="" fill="rgba(245,158,11,0.15)"/>
    <!-- House line (blue) -->
    <polyline id="house-line" points="" fill="none" stroke="#3B82F6" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4,3"/>
    <!-- Grid line -->
    <polyline id="grid-line" points="" fill="none" stroke="#22C55E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3,3"/>
    <!-- Battery line (orange) -->
    <polyline id="batt-line" points="" fill="none" stroke="#F97316" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- PV line (amber, topmost) -->
    <polyline id="pv-line" points="" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="no-data" id="no-data">Daten werden gesammelt…<br>Erster Punkt in wenigen Minuten.</div>
</div>

<div class="time-row">
  <span class="time-lbl" id="t-start">−12h</span>
  <span class="time-lbl" id="t-mid">−6h</span>
  <span class="time-lbl" id="t-now">Jetzt</span>
</div>

<div class="stats">
  <div class="stat-chip">
    <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="13,2 3,14 12,14 11,22 21,10 12,10"/>
    </svg>
    <span class="stat-val" id="grid-stat">—</span>
  </div>
  <div class="stat-chip">
    <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="batt-chip-icon">
      <rect x="2" y="7" width="16" height="10" rx="2"/>
      <line x1="22" y1="10" x2="22" y2="14"/>
    </svg>
    <span class="stat-val" id="batt-stat">—</span>
  </div>
  <div class="stat-chip">
    <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <polyline points="9,22 9,12 15,12 15,22"/>
    </svg>
    <span class="stat-val" id="house-stat">—</span>
  </div>
</div>

<script>
var W = 300, H = 80;
var BOTTOM = H - 2;   // baseline y in SVG coords
var TOP    = 3;       // top y

function fmt(w) {
  if (w === null || w === undefined) return '—';
  var abs = Math.abs(w);
  if (abs >= 1000) return (abs / 1000).toFixed(1) + ' kW';
  return Math.round(abs) + ' W';
}

function fmtHour(ts) {
  var d = new Date(ts);
  return d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2);
}

function buildPolyline(pts, fromTime, toTime, scale, invertY) {
  if (!pts || pts.length < 2) return '';
  return pts.map(function(p) {
    var x = ((p.t - fromTime) / (toTime - fromTime)) * W;
    var v = invertY ? -p.v : p.v;
    var y = BOTTOM - (Math.max(0, v) / scale) * (BOTTOM - TOP);
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
}

function buildFill(pts, fromTime, toTime, scale, invertY) {
  if (!pts || pts.length < 2) return '';
  var line = pts.map(function(p) {
    var x = ((p.t - fromTime) / (toTime - fromTime)) * W;
    var v = invertY ? -p.v : p.v;
    var y = BOTTOM - (Math.max(0, v) / scale) * (BOTTOM - TOP);
    return x.toFixed(1) + ',' + y.toFixed(1);
  });
  var firstX = ((pts[0].t  - fromTime) / (toTime - fromTime)) * W;
  var lastX  = ((pts[pts.length - 1].t - fromTime) / (toTime - fromTime)) * W;
  return line.join(' ') + ' ' + lastX.toFixed(1) + ',' + BOTTOM + ' ' + firstX.toFixed(1) + ',' + BOTTOM;
}

function onHomeyReady(Homey) {
  Homey.ready({ height: 235 });
  document.body.classList.add('loading');

  // Read series visibility from widget settings (defaults: PV+Grid on, Batt+House off)
  var showPv = true, showGrid = true, showBatt = false, showHouse = false;
  try {
    var s = Homey.getSettings();
    if (s) {
      showPv   = s.show_pv   !== false;
      showGrid = s.show_grid !== false;
      showBatt  = s.show_battery      === true;
      showHouse = s.show_house        === true;
    }
  } catch(e) {}

  function setSeries(lineId, fillId, pts, fromTime, toTime, scale) {
    var l = document.getElementById(lineId);
    var f = document.getElementById(fillId);
    l.setAttribute('points', buildPolyline(pts, fromTime, toTime, scale, false));
    if (f) f.setAttribute('points', buildFill(pts, fromTime, toTime, scale, false));
  }

  function clearSeries(lineId, fillId) {
    document.getElementById(lineId).setAttribute('points', '');
    if (fillId) document.getElementById(fillId).setAttribute('points', '');
  }

  function render(data) {
    document.body.classList.remove('loading');

    // Current values (stats chips — always shown)
    document.getElementById('live-pv').textContent    = fmt(data.pvNow);
    document.getElementById('grid-stat').textContent  = fmt(data.gridNow);
    document.getElementById('batt-stat').textContent  = fmt(data.battNow);
    document.getElementById('house-stat').textContent = fmt(data.houseNow);

    // Battery icon color
    var battIcon = document.getElementById('batt-chip-icon');
    if (data.battNow > 50)       battIcon.setAttribute('stroke', '#22C55E');
    else if (data.battNow < -50) battIcon.setAttribute('stroke', '#F97316');
    else                         battIcon.setAttribute('stroke', '#9CA3AF');

    // Grid stat color
    var gridStat = document.getElementById('grid-stat');
    if      (data.gridNow < -50) gridStat.style.color = '#22C55E';
    else if (data.gridNow > 50)  gridStat.style.color = '#EF4444';
    else                         gridStat.style.color = '';

    // Peak
    if (data.peakToday !== null && data.peakToday !== undefined) {
      document.getElementById('peak-wrap').style.display = '';
      document.getElementById('peak-val').textContent = fmt(data.peakToday);
    }

    // Series come pre-formatted as [{t, v}] from api.js (Insights or buffer)
    var ser      = data.series || {};
    var pvSer    = (ser.pv    || []);
    var gridSer  = (ser.grid  || []);
    var battSer  = (ser.batt  || []);
    var houseSer = (ser.house || []);

    var noDataEl = document.getElementById('no-data');
    var chartEl  = document.getElementById('chart');

    var hasSeries = pvSer.length >= 2 || gridSer.length >= 2 ||
                    battSer.length >= 2 || houseSer.length >= 2;
    if (!hasSeries) {
      noDataEl.style.display = 'flex';
      chartEl.style.display  = 'none';
      return;
    }

    noDataEl.style.display = 'none';
    chartEl.style.display  = 'block';

    var now      = Date.now();
    var fromTime = now - 12 * 3600 * 1000;
    var toTime   = now;

    // Time labels
    document.getElementById('t-start').textContent = fmtHour(fromTime);
    document.getElementById('t-mid').textContent   = fmtHour(fromTime + 6 * 3600 * 1000);

    // Filter all series to the 12h window
    var pv    = pvSer.filter(function(p)    { return p.t >= fromTime; });
    var grid  = gridSer.filter(function(p)  { return p.t >= fromTime; });
    var batt  = battSer.filter(function(p)  { return p.t >= fromTime; });
    var house = houseSer.filter(function(p) { return p.t >= fromTime; });

    // Scale: max across all enabled visible series
    var scaleCandidates = [500];
    if (showPv)    pv.forEach(function(p)    { scaleCandidates.push(p.v   || 0); });
    if (showGrid)  grid.forEach(function(p)  { scaleCandidates.push(Math.abs(p.v  || 0)); });
    if (showBatt)  batt.forEach(function(p)  { scaleCandidates.push(Math.abs(p.v  || 0)); });
    if (showHouse) house.forEach(function(p) { scaleCandidates.push(p.v   || 0); });
    var scale = Math.max.apply(null, scaleCandidates);

    // --- PV series (already {t,v}) ---
    if (showPv && pv.length >= 2) {
      setSeries('pv-line', 'pv-fill', pv, fromTime, toTime, scale);
    } else {
      clearSeries('pv-line', 'pv-fill');
    }

    // --- Grid series: signed → split export/import ---
    if (showGrid && grid.length >= 2) {
      var exportPts = grid.filter(function(p) { return p.v < 0; })
                          .map(function(p)    { return { t: p.t, v: -p.v }; });
      var importPts = grid.filter(function(p) { return p.v > 0; });
      document.getElementById('export-fill').setAttribute('points', buildFill(exportPts, fromTime, toTime, scale, false));
      document.getElementById('import-fill').setAttribute('points', buildFill(importPts, fromTime, toTime, scale, false));
      var exportSum    = exportPts.reduce(function(s, p) { return s + p.v; }, 0);
      var importSum    = importPts.reduce(function(s, p) { return s + p.v; }, 0);
      var gridColor    = exportSum >= importSum ? '#22C55E' : '#EF4444';
      var absGridPts   = grid.map(function(p) { return { t: p.t, v: Math.abs(p.v) }; });
      document.getElementById('grid-line').setAttribute('stroke', gridColor);
      document.getElementById('grid-line').setAttribute('points', buildPolyline(absGridPts, fromTime, toTime, scale, false));
    } else {
      clearSeries('grid-line', 'export-fill');
      document.getElementById('import-fill').setAttribute('points', '');
    }

    // --- Battery series: absolute value ---
    if (showBatt && batt.length >= 2) {
      var battAbs = batt.map(function(p) { return { t: p.t, v: Math.abs(p.v) }; });
      setSeries('batt-line', 'batt-fill', battAbs, fromTime, toTime, scale);
    } else {
      clearSeries('batt-line', 'batt-fill');
    }

    // --- House series ---
    if (showHouse && house.length >= 2) {
      setSeries('house-line', 'house-fill', house, fromTime, toTime, scale);
    } else {
      clearSeries('house-line', 'house-fill');
    }
  }

  function load() {
    Homey.api('GET', '/', {})
      .then(function(data) { if (data) render(data); })
      .catch(function(err) { console.error('power-chart error:', err); });
  }

  load();
  setInterval(load, 10000);
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden) load();
  });
}
</script>
</body>
</html>
