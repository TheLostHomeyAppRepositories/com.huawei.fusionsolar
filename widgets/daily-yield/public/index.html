<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Yield</title>
<style>
    /* Hold still under fingers. A dashboard tile is not a document: pinch-zoom,
       pan, rubber-band scroll and long-press selection all read as the widget
       misbehaving when the user only meant to scroll the dashboard past it. */
    html, body {
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: transparent;
    padding: 14px;
  }

  .main-row {
    display: flex;
    align-items: flex-end;
    gap: 16px;
    margin-bottom: 10px;
  }

  .daily-block {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .daily-label {
    font-size: 11px;
    color: var(--homey-text-color-light);
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .daily-value {
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -1px;
    color: #F59E0B;
    line-height: 1;
  }

  .daily-unit {
    font-size: 14px;
    font-weight: 500;
    color: var(--homey-text-color-light);
  }

  .total-block {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding-bottom: 4px;
  }

  .total-label {
    font-size: 11px;
    color: var(--homey-text-color-light);
  }

  .total-value {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.3px;
    color: var(--homey-text-color);
  }

  /* CO₂ + Optimizer row */
  .meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
    gap: 8px;
  }

  .co2-chip {
    display: flex;
    align-items: center;
    gap: 5px;
    background: var(--homey-line-color);
    border-radius: 8px;
    padding: 4px 9px;
  }

  .co2-icon {
    width: 13px;
    height: 13px;
    flex-shrink: 0;
  }

  .co2-text {
    font-size: 12px;
    font-weight: 600;
    color: #22C55E;
  }

  .co2-label {
    font-size: 11px;
    color: var(--homey-text-color-light);
  }

  .opt-chip {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .opt-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #22C55E;
    flex-shrink: 0;
  }

  .opt-text {
    font-size: 11px;
    color: var(--homey-text-color-light);
  }

  /* Skeleton */
  @keyframes skeleton-pulse {
    0%, 100% { opacity: 0.35; }
    50%       { opacity: 0.7; }
  }
  body.loading #daily-val,
  body.loading .total-value {
    animation: skeleton-pulse 1.4s ease-in-out infinite;
  }
</style>
</head>
<body class="loading">

<div class="main-row">
  <div class="daily-block">
    <div class="daily-label" id="label-daily"></div>
    <div class="daily-value">
      <span id="daily-val">—</span><span class="daily-unit" id="daily-unit"></span>
    </div>
  </div>
  <div class="total-block">
    <div class="total-label" id="label-total"></div>
    <div class="total-value" id="total-val">—</div>
  </div>
</div>

<div class="meta-row">
  <!-- CO₂ chip -->
  <div class="co2-chip" id="co2-chip" style="display:none">
    <svg class="co2-icon" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a10 10 0 1 0 10 10"/>
      <path d="M12 8v4l3 3"/>
    </svg>
    <span class="co2-text" id="co2-val"></span>
    <span class="co2-label" id="label-co2"></span>
  </div>

  <!-- Optimizer chip -->
  <div class="opt-chip" id="opt-chip" style="display:none">
    <div class="opt-dot" id="opt-dot"></div>
    <span class="opt-text" id="opt-text"></span>
  </div>
</div>

<script>
// Language comes from the API payload (Homey i18n.getLanguage()), not
// navigator.language — see widgets/ems-device/api.js.
var DICTS = (function() {
  var de = { daily: 'Heute erzeugt',   total: 'Gesamt', co2: 'CO₂ gespart',  optimizers: 'Optimierer'  };
  var nl = { daily: 'Vandaag opgewekt', total: 'Totaal', co2: 'CO₂ bespaard', optimizers: 'Optimizers'  };
  var en = { daily: 'Generated today',  total: 'Total',  co2: 'CO₂ saved',    optimizers: 'Optimizers'  };
  return { de: de, nl: nl, en: en };
})();
function dictFor(code) {
  var l = String(code || '');
  return l.indexOf('de') === 0 ? DICTS.de : l.indexOf('nl') === 0 ? DICTS.nl : DICTS.en;
}
var activeLang = null;
var T = dictFor(navigator.language); // placeholder until the first payload arrives
function applyLang(code) {
  if (!code || code === activeLang) return false;
  activeLang = code;
  T = dictFor(code);
  applyStaticLabels();
  return true;
}

// Re-applied on a language change so static labels never stay in the
// language the widget first rendered in (mixed-language UI).
function applyStaticLabels() {
  document.getElementById('label-daily').textContent = T.daily;
  document.getElementById('label-total').textContent = T.total;
  document.getElementById('label-co2').textContent   = T.co2;
}
applyStaticLabels();

function fmtKwh(v) {
  if (v === null || v === undefined) return { num: '—', unit: '' };
  if (v >= 1000) return { num: (v / 1000).toFixed(1), unit: ' MWh' };
  return { num: v.toFixed(2), unit: ' kWh' };
}

function onHomeyReady(Homey) {
  Homey.ready({ height: 112 });
  document.body.classList.add('loading');

  var co2Factor = 401; // default: DE Strommix g/kWh
  try {
    var s = Homey.getSettings();
    if (s && s.co2_factor_g_per_kwh) co2Factor = parseFloat(s.co2_factor_g_per_kwh) || 401;
  } catch(e) {}

  function render(data) {
    document.body.classList.remove('loading');

    var daily = fmtKwh(data.dailyKwh);
    document.getElementById('daily-val').textContent  = daily.num;
    document.getElementById('daily-unit').textContent = daily.unit;

    var total = fmtKwh(data.totalKwh);
    document.getElementById('total-val').textContent =
      (total.num !== '—') ? total.num + total.unit : '—';

    // CO₂ — recalculate client-side using configured factor
    var co2Chip = document.getElementById('co2-chip');
    if (data.dailyKwh !== null && data.dailyKwh !== undefined) {
      var co2Kg = Math.round(data.dailyKwh * co2Factor) / 1000;
      co2Chip.style.display = 'flex';
      document.getElementById('co2-val').textContent = co2Kg.toFixed(2) + ' kg';
    } else {
      co2Chip.style.display = 'none';
    }

    // Optimizers
    var tot = data.optimizerTotal;
    var onl = data.optimizerOnline;
    var optChip = document.getElementById('opt-chip');
    if (tot !== null && tot !== undefined && onl !== null && onl !== undefined) {
      optChip.style.display = 'flex';
      document.getElementById('opt-text').textContent = onl + '/' + tot + ' ' + T.optimizers;
      document.getElementById('opt-dot').style.background =
        (onl >= tot) ? '#22C55E' : (onl > 0 ? '#F59E0B' : '#EF4444');
    } else {
      optChip.style.display = 'none';
    }
  }

  function load() {
    Homey.api('GET', '/', {})
      .then(function(data) { applyLang(data && data.lang); if (data) render(data); })
      .catch(function(err) { console.error('widget load error:', err); });
  }

  load();
  // Polling stops entirely while the dashboard is hidden — it used to keep running
  // around the clock — and catches up immediately on return.
  var POLL_MS = 10000;
  var pollTimer = null;
  function startPolling() { if (!pollTimer) pollTimer = setInterval(load, POLL_MS); }
  function stopPolling()  { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
  if (!document.hidden) startPolling();
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) { stopPolling(); return; }
    load();
    startPolling();
  });
}
</script>
</body>
</html>
